# One module: an HTTP GET that must return 2xx. /ready returns 503 when Postgres or Redis is down, which counts as a failure.
# /ready returns 200 with status "degraded" when only the Stellar RPC is down; metrics.sh watches the RPC separately.
modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      follow_redirects: false
