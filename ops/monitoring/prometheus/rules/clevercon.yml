# Alert rules. severity=critical goes to Slack; severity=warning stays on the dashboard only.
# Every rule has a `for:` so one bad scrape never pages anyone.
groups:
  - name: clevercon-availability
    rules:
      - alert: TargetDown
        expr: up{job=~"staging_.*|api_.*"} == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: 'Cannot scrape {{ $labels.job }} on {{ $labels.instance }} for 3 minutes (host or exporter down).'

      - alert: ApiDown
        expr: probe_success{job="api_health"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: 'API /health is failing on {{ $labels.instance }} (process down or not answering).'

      - alert: ApiNotReady
        expr: probe_success{job="api_ready"} == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: 'API /ready is failing on {{ $labels.instance }} (Postgres or Redis unreachable from the API).'

      - alert: ContainerNotRunning
        expr: clevercon_container_running == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: 'Container "{{ $labels.service }}" is not running on staging.'

      - alert: ContainerRestarting
        expr: increase(clevercon_container_restarts_total[15m]) > 2
        labels: { severity: critical }
        annotations:
          summary: 'Container "{{ $labels.service }}" restarted more than twice in 15 minutes.'
      
      - alert: IndexerHeartbeatMissing
        # No indexer_state row at all: the age metric does not exist, so the rule above stays silent.
        # The `and on()` part keeps it quiet when staging is not registered (after teardown).
        expr: absent(clevercon_indexer_state_age_seconds) and on() (up{job="staging_node"} == 1)
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: 'The indexer has saved no cursor (no indexer_state row). It is probably failing; check its logs.'
  
  - name: clevercon-chain-and-jobs
    rules:
      - alert: IndexerHeartbeatStale
        # The indexer polls every 5s and saves its cursor on each good poll.
        expr: clevercon_indexer_state_age_seconds > 120
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: 'Indexer stream "{{ $labels.stream }}" has not saved its cursor for {{ $value | humanizeDuration }}.'

      - alert: RpcUnreachable
        expr: clevercon_rpc_up == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: 'Stellar RPC does not answer from the staging host. The API still reports ready (RPC down only means "degraded"), so this is the only alert for it.'

      - alert: VaultTtlLow
        expr: clevercon_vault_days_left < 3
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: 'Vault contract instance expires in {{ $value | printf "%.1f" }} days. Extend its TTL.'

      - alert: VaultTtlGettingLow
        expr: clevercon_vault_days_left < 14
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'Vault contract instance expires in {{ $value | printf "%.1f" }} days.'

      - alert: VaultCheckFailing
        # The TTL check could not read the vault entry (RPC error, wrong contract ID, or the api container is down).
        expr: clevercon_vault_check_ok == 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: 'The vault TTL check has failed for 30 minutes, so vault_days_left is not being updated.'

      - alert: WorkersSweepStale
        # The health sweep runs every 300s by default (HEALTH_SWEEP_SECONDS).
        expr: clevercon_workers_last_sweep_age_seconds > 900
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: 'No "health sweep processed" log line from workers for {{ $value | humanizeDuration }}.'

      - alert: MetricsScriptStale
        # Guards the guards: if metrics.sh stops, the clevercon_* alerts above would go quiet.
        expr: time() - node_textfile_mtime_seconds{file="clevercon.prom"} > 300
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: 'metrics.sh on staging has not written its file for {{ $value | humanizeDuration }}. Indexer, RPC and vault alerts are blind.'

  - name: clevercon-host
    rules:
      - alert: DiskAlmostFull
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}) < 0.15
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: 'Disk on {{ $labels.instance }} is {{ $value | humanizePercentage }} free.'

      - alert: MemoryHigh
        # Dashboard only until we have a baseline (see ops/docs/monitoring.md).
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.90
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'Memory on {{ $labels.instance }} is {{ $value | humanizePercentage }} used.'
