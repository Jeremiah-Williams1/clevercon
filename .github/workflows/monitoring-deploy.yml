name: monitoring-deploy

# Manual only. Launches or updates the monitoring host (Name=clevercon-monitoring), stops it to save cost, or terminates it.
#   deploy   : launch it if there is none, start it if stopped, put this commit on it, sync the staging target
#   stop     : stop the instance (disk and private IP are kept)
#   teardown : terminate the instance (its disk and the metrics history are deleted)
# Secrets come from SSM Parameter Store (see ops/docs/monitoring.md); none pass through this workflow.
on:
  workflow_dispatch:
    inputs:
      action:
        description: deploy (launch/start and update), stop, or teardown (terminate)
        type: choice
        options: [deploy, stop, teardown]
        default: deploy

permissions:
  id-token: write
  contents: read

concurrency:
  group: staging # shared with staging-deploy so the two never run at the same time
  cancel-in-progress: false

jobs:
  monitoring:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    env:
      NAME: clevercon-monitoring
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Find the monitoring host
        run: |
          ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$NAME" "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[].Instances[].InstanceId | [0]' --output text)
          [ "$ID" = "None" ] && ID=""
          echo "ID=$ID" >> "$GITHUB_ENV"
          echo "existing monitoring host: ${ID:-none}"

      - name: Stop
        if: inputs.action == 'stop'
        run: |
          [ -n "$ID" ] || { echo "nothing to stop"; exit 0; }
          aws ec2 stop-instances --instance-ids "$ID" --query 'StoppingInstances[].CurrentState.Name' --output text
          echo "Monitoring host stopping. The disk is kept and the private IP stays the same when it starts again." >> "$GITHUB_STEP_SUMMARY"

      - name: Teardown
        if: inputs.action == 'teardown'
        run: |
          [ -n "$ID" ] || { echo "nothing to tear down"; exit 0; }
          aws ec2 terminate-instances --instance-ids "$ID" --query 'TerminatingInstances[].CurrentState.Name' --output text
          echo "Monitoring host terminated: its disk and metrics history are gone." >> "$GITHUB_STEP_SUMMARY"

      - name: Launch the host if there is none, else start it
        if: inputs.action == 'deploy'
        run: |
          if [ -z "$ID" ]; then
            AMI=$(aws ssm get-parameter --query Parameter.Value --output text \
              --name /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id)
            SG=$(aws ec2 describe-security-groups --filters Name=group-name,Values=clevercon-monitoring \
              --query 'SecurityGroups[0].GroupId' --output text)
            [ "$SG" != "None" ] || { echo "::error::security group clevercon-monitoring not found"; exit 1; }
            TAGS="Tags=[{Key=Name,Value=$NAME},{Key=project,Value=clevercon}]"
            ID=$(aws ec2 run-instances --image-id "$AMI" --instance-type t3.small \
              --security-group-ids "$SG" --iam-instance-profile Name=clevercon-monitoring-ec2 \
              --metadata-options HttpTokens=required,HttpEndpoint=enabled \
              --block-device-mappings 'DeviceName=/dev/sda1,Ebs={VolumeSize=20,VolumeType=gp3,Encrypted=true}' \
              --user-data file://ops/scripts/bootstrap-host.sh \
              --tag-specifications "ResourceType=instance,$TAGS" "ResourceType=volume,$TAGS" \
              --query 'Instances[0].InstanceId' --output text)
            echo "ID=$ID" >> "$GITHUB_ENV"
            echo "launched $ID"
          else
            aws ec2 start-instances --instance-ids "$ID" >/dev/null   # no-op if already running
          fi
          aws ec2 wait instance-running --instance-ids "$ID"

      - name: Helper to run commands on the host
        if: inputs.action == 'deploy'
        run: |
          cat > "$RUNNER_TEMP/remote.sh" <<'HELPER'
          # usage: remote "<script run as the ubuntu user>"  (fails if the script fails)
          remote() {
            local cmd id s
            cmd="echo $(printf %s "set -euo pipefail; $1" | base64 -w0) | base64 -d | sudo -u ubuntu -H bash -l"
            id=$(aws ssm send-command --instance-ids "$ID" --document-name AWS-RunShellScript \
              --parameters "$(jq -n --arg c "$cmd" --arg t "600" '{commands:[$c],executionTimeout:[$t]}')" \
              --query Command.CommandId --output text)
            while :; do
              s=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$ID" \
                    --query Status --output text 2>/dev/null || echo Pending)
              case "$s" in Success|Failed|Cancelled|TimedOut) break;; esac
              sleep 5
            done
            aws ssm get-command-invocation --command-id "$id" --instance-id "$ID" \
              --query StandardOutputContent --output text | tail -n 60
            aws ssm get-command-invocation --command-id "$id" --instance-id "$ID" \
              --query StandardErrorContent --output text | tail -n 20 >&2
            [ "$s" = Success ]
          }
          HELPER

      - name: Wait for SSM and the bootstrap
        if: inputs.action == 'deploy'
        run: |
          . "$RUNNER_TEMP/remote.sh"
          for i in $(seq 1 40); do
            p=$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$ID" \
                  --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || true)
            [ "$p" = "Online" ] && break; sleep 15
          done
          [ "$p" = "Online" ] || { echo "::error::monitoring host never came online in SSM"; exit 1; }
          for i in $(seq 1 40); do
            remote "grep -q 'BOOTSTRAP DONE' /var/log/cloud-init-output.log && test -d ~/clevercon/.git" && break
            sleep 15
          done
          remote "test -d ~/clevercon/.git"

      - name: Put this commit on the host and start the stack
        if: inputs.action == 'deploy'
        run: |
          . "$RUNNER_TEMP/remote.sh"
          remote "
            cd ~/clevercon
            git fetch --quiet origin $SHA
            git checkout --quiet --force $SHA
            cd ops/monitoring
            bash setup-secrets.sh
            docker compose -f docker-compose.monitoring.yml up -d --force-recreate
            sleep 15
            docker compose -f docker-compose.monitoring.yml ps
            docker compose -f docker-compose.monitoring.yml exec -T alertmanager amtool check-config /etc/alertmanager/alertmanager.yml
            curl -fsS localhost:9090/-/ready"

      - name: Sync the staging target
        if: inputs.action == 'deploy'
        run: |
          . "$RUNNER_TEMP/remote.sh"
          IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=clevercon-staging" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].PrivateIpAddress' --output text)
          if [ "$IP" = "None" ] || [ -z "$IP" ]; then
            remote "cd ~/clevercon && ./ops/monitoring/register-target.sh remove"
            echo "No running staging host: staging target removed." >> "$GITHUB_STEP_SUMMARY"
          else
            remote "cd ~/clevercon && ./ops/monitoring/register-target.sh add $IP"
            echo "Watching staging at $IP." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: How to open Grafana
        if: inputs.action == 'deploy'
        run: |
          echo "Monitoring host $ID is up. Open Grafana from your laptop with:" >> "$GITHUB_STEP_SUMMARY"
          echo "aws ssm start-session --target $ID --document-name AWS-StartPortForwardingSession --parameters '{\"portNumber\":[\"3000\"],\"localPortNumber\":[\"3000\"]}'" >> "$GITHUB_STEP_SUMMARY"