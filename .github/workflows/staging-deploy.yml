name: staging-deploy

# Manual only. Needs the "staging" Environment (required reviewer) and the AWS role
# whose trust rule accepts only that Environment.
on:
  workflow_dispatch:
    inputs:
      action:
        description: deploy, or teardown (terminates the instance)
        type: choice
        options: [deploy, teardown]
        default: deploy
      e2e_mode:
        description: End-to-end test to run after deploy (none skips it)
        type: choice
        options: [none, core, pp2, full]
        default: none

permissions:
  id-token: write # lets the job ask GitHub for an OIDC token
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 75
    env:
      NAME: clevercon-staging
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Helper to run commands on the instance
        run: |
          cat > "$RUNNER_TEMP/remote.sh" <<'HELPER'
          # usage: remote "<script run as the ubuntu user>"  (fails if the script fails)
          # REMOTE_TIMEOUT (seconds, default 3000) caps how long the command may run on the host.
          remote() {
            local cmd id s
            cmd="echo $(printf %s "set -euo pipefail; $1" | base64 -w0) | base64 -d | sudo -u ubuntu -H bash -l"
            id=$(aws ssm send-command --instance-ids "${REMOTE_ID:-$ID}" --document-name AWS-RunShellScript \
              --parameters "$(jq -n --arg c "$cmd" --arg t "${REMOTE_TIMEOUT:-3000}" '{commands:[$c],executionTimeout:[$t]}')" \
              --query Command.CommandId --output text)
            while :; do
              s=$(aws ssm get-command-invocation --command-id "$id" --instance-id "${REMOTE_ID:-$ID}" \
                    --query Status --output text 2>/dev/null || echo Pending)
              case "$s" in Success|Failed|Cancelled|TimedOut) break;; esac
              sleep 10
            done
            aws ssm get-command-invocation --command-id "$id" --instance-id "${REMOTE_ID:-$ID}" \
              --query StandardOutputContent --output text | tail -n 60
            aws ssm get-command-invocation --command-id "$id" --instance-id "${REMOTE_ID:-$ID}" \
              --query StandardErrorContent --output text | tail -n 20 >&2
            [ "$s" = Success ]
          }
          HELPER

      - name: Find the instance
        run: |
          ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$NAME" "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[].Instances[].InstanceId | [0]' --output text)
          [ "$ID" = "None" ] && ID=""
          echo "ID=$ID" >> "$GITHUB_ENV"
          echo "existing instance: ${ID:-none}"

      - name: Find the monitoring host (optional)
        run: |
          MON=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=clevercon-monitoring" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId | [0]' --output text)
          [ "$MON" = "None" ] && MON=""
          if [ -n "$MON" ]; then
            p=$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$MON" \
                  --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || true)
            [ "$p" = "Online" ] || { echo "::warning::monitoring host $MON is not online in SSM; skipping monitoring steps"; MON=""; }
          else
            echo "::warning::no running monitoring host; skipping monitoring steps. Run monitoring-deploy (start) later: it syncs the target."
          fi
          echo "MON_ID=$MON" >> "$GITHUB_ENV"

      - name: Stop watching staging (teardown)
        if: inputs.action == 'teardown' && env.MON_ID != ''
        continue-on-error: true
        run: |
          . "$RUNNER_TEMP/remote.sh"
          export REMOTE_ID="$MON_ID"
          remote "cd ~/clevercon && ./ops/monitoring/register-target.sh remove"

      - name: Teardown
        if: inputs.action == 'teardown'
        run: |
          [ -n "$ID" ] || { echo "nothing to tear down"; exit 0; }
          aws ec2 terminate-instances --instance-ids "$ID" --query 'TerminatingInstances[].CurrentState.Name' --output text

      - name: Launch the instance if there is none
        if: inputs.action == 'deploy'
        run: |
          if [ -z "$ID" ]; then
            AMI=$(aws ssm get-parameter --query Parameter.Value --output text \
              --name /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id)
            SG=$(aws ec2 describe-security-groups --filters Name=group-name,Values=clevercon-staging \
              --query 'SecurityGroups[0].GroupId' --output text)
            TAGS="Tags=[{Key=Name,Value=$NAME},{Key=project,Value=clevercon}]"
            ID=$(aws ec2 run-instances --image-id "$AMI" --instance-type t3.large \
              --security-group-ids "$SG" --iam-instance-profile Name=clevercon-staging-ec2 \
              --metadata-options HttpTokens=required,HttpEndpoint=enabled \
              --block-device-mappings 'DeviceName=/dev/sda1,Ebs={VolumeSize=40,VolumeType=gp3,Encrypted=true}' \
              --user-data file://ops/scripts/bootstrap-host.sh \
              --tag-specifications "ResourceType=instance,$TAGS" "ResourceType=volume,$TAGS" \
              --query 'Instances[0].InstanceId' --output text)
            echo "ID=$ID" >> "$GITHUB_ENV"
            echo "launched $ID"
          else
            aws ec2 start-instances --instance-ids "$ID" >/dev/null   # no-op if already running
          fi
          aws ec2 wait instance-running --instance-ids "$ID"

      - name: Wait for SSM and the bootstrap
        if: inputs.action == 'deploy'
        run: |
          . "$RUNNER_TEMP/remote.sh"
          for i in $(seq 1 40); do
            p=$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$ID" \
                  --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || true)
            [ "$p" = "Online" ] && break; sleep 15
          done
          [ "$p" = "Online" ] || { echo "instance never came online in SSM"; exit 1; }
          for i in $(seq 1 40); do
            remote "grep -q 'BOOTSTRAP DONE' /var/log/cloud-init-output.log && test -d ~/clevercon/.git" && break
            sleep 15
          done
          remote "test -d ~/clevercon/.git"

      - name: Deploy this commit
        if: inputs.action == 'deploy'
        run: |
          . "$RUNNER_TEMP/remote.sh"
          remote "
            cd ~/clevercon
            git fetch --quiet origin $SHA
            git checkout --quiet --force $SHA
            [ -f ops/staging/.env.staging ] || ./ops/staging/gen-env.sh
            ./ops/staging/build.sh
            ./ops/staging/up.sh"

      - name: Install monitoring collectors
        if: inputs.action == 'deploy'
        continue-on-error: true   # monitoring never blocks a deploy
        run: |
          . "$RUNNER_TEMP/remote.sh"
          remote "cd ~/clevercon && ./ops/monitoring/staging-collectors/install.sh"

      - name: Smoke test and security check
        if: inputs.action == 'deploy'
        run: |
          . "$RUNNER_TEMP/remote.sh"
          remote "
            cd ~/clevercon
            curl -fsS localhost:4100/health; echo
            curl -sS localhost:4100/ready; echo
            ./ops/staging/security-check.sh"

      - name: Register staging with monitoring
        if: inputs.action == 'deploy' && env.MON_ID != ''
        continue-on-error: true
        run: |
          IP=$(aws ec2 describe-instances --instance-ids "$ID" \
            --query 'Reservations[0].Instances[0].PrivateIpAddress' --output text)
          . "$RUNNER_TEMP/remote.sh"
          export REMOTE_ID="$MON_ID"
          remote "cd ~/clevercon && ./ops/monitoring/register-target.sh add $IP"

      - name: e2e (throwaway wallets)
        if: inputs.action == 'deploy' && inputs.e2e_mode != 'none'
        timeout-minutes: 30
        env:
          E2E_MODE: ${{ inputs.e2e_mode }}
          REMOTE_TIMEOUT: '1500' # seconds; the host stops the command after this
        run: |
          . "$RUNNER_TEMP/remote.sh"
          remote "cd ~/clevercon && E2E_MODE=$E2E_MODE ./ops/staging/e2e.sh"

      - name: Reminder
        if: always() && inputs.action == 'deploy'
        run: |
          echo "Instance ${ID:-unknown} may still be running and billing. Run this workflow again with action teardown when you are done." >> "$GITHUB_STEP_SUMMARY"